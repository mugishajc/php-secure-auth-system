name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo, pdo_sqlite, mbstring
          coverage: none

      - name: Show password hashing support
        run: php -r 'echo "Argon2id: ", defined("PASSWORD_ARGON2ID") ? "yes" : "no", PHP_EOL;'

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Lint
        run: find src public bin tests templates -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Run tests
        run: vendor/bin/phpunit

      - name: Smoke test the demo
        run: |
          cp .env.example .env
          php bin/setup-db.php
          php -S 127.0.0.1:8000 -t public > /tmp/server.log 2>&1 &
          sleep 2
          bin/smoke-test.sh || (cat /tmp/server.log; exit 1)
